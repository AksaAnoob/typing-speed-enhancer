<!DOCTYPE html>

<html>
<head>
    <title>Type Mastery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#0f172a,#1e293b,#3b82f6);
    }

    .card{
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(15px);
        padding:40px;
        border-radius:20px;
        text-align:center;
        color:white;
        width:400px;
    }

    h1{
        margin-bottom:15px;
    }

    p{
        margin-bottom:30px;
    }

    .btn{
        display:block;
        width:100%;
        margin:10px 0;
        padding:12px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:16px;
        text-decoration:none;
        color:white;
        background:#2563eb;
    }

    .btn:hover{
        transform:scale(1.03);
    }
</style>


</head>

<body>

<div class="card">
    <h1>TYPE MASTERY</h1>


<p>
    Improve your typing speed,
    accuracy and consistency.
</p>

<a href="login.html" class="btn">Login</a>

<a href="register.html" class="btn">Register</a>


</div>

</body>
</html>
