<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard - Type Mastery</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1>🏆 Leaderboard</h1>

<table id="leaderboardTable">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>WPM</th>
            <th>Accuracy</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

const currentUser = localStorage.getItem("username");

/* ---------- AVATAR URL HELPER ---------- */

function getAvatarUrl(seed) {

    if (!seed)
        return "https://api.dicebear.com/7.x/adventurer/svg?seed=guest";

    if (seed.startsWith("animal"))
        return `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${seed}`;

    if (seed.startsWith("flower"))
        return `https://api.dicebear.com/7.x/icons/svg?seed=${seed}`;

    if (seed.startsWith("fruit"))
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;

    if (seed.startsWith("fun"))
        return `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}`;

    return `https://api.dicebear.com/7.x/identicon/svg?seed=${seed}`;
}

/* ---------- LOAD LEADERBOARD ---------- */

fetch("https://typing-speed-enhancer-1.onrender.com/leaderboard")
.then(res => res.json())
.then(scores => {

    const tbody =
        document.querySelector("#leaderboardTable tbody");

    scores.forEach((score, index) => {

        let rank;

        if (index === 0) rank = "🥇";
        else if (index === 1) rank = "🥈";
        else if (index === 2) rank = "🥉";
        else rank = index + 1;

        let rowClass = "";

        if (score.username === currentUser) {
            rowClass = "current-user";
        }

        const row = `
            <tr class="${rowClass}">
                <td>${rank}</td>

                <td style="display:flex;align-items:center;gap:10px;">
                    <img
                        src="${getAvatarUrl(score.avatar)}"
                        width="40"
                        height="40"
                        style="border-radius:50%;border:2px solid #60a5fa;"
                    >
                    ${score.username}
                </td>

                <td>${score.wpm}</td>
                <td>${score.accuracy}%</td>
            </tr>
        `;

        tbody.innerHTML += row;
    });

})
.catch(err => console.error(err));

</script>

</body>
</html>
