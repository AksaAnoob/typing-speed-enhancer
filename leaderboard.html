<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard - Type Mastery</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h1>🏆 Leaderboard</h1>

<table id="leaderboardTable">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>WPM</th>
            <th>Accuracy</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

<script>

const currentUser = localStorage.getItem("username");

/* ---------- LOAD LEADERBOARD ---------- */

fetch("https://typing-speed-enhancer-1.onrender.com/leaderboard")
.then(res => res.json())
.then(scores => {

    const tbody = document.querySelector("#leaderboardTable tbody");

    /* ---------- FIX: TIE SAFE RANKING ---------- */
    let rank = 1;

    for (let i = 0; i < scores.length; i++) {

        if (i > 0 && scores[i].wpm < scores[i - 1].wpm) {
            rank = i + 1;
        }

        scores[i].rank = rank;
    }

    /* ---------- RENDER TABLE ---------- */

    scores.forEach((score, index) => {

        let rowClass = "";

        if (score.username === currentUser) {
            rowClass = "current-user";
        }

        const row = `
            <tr class="${rowClass}">
                <td>
                    ${score.rank === 1 ? "🥇" :
                      score.rank === 2 ? "🥈" :
                      score.rank === 3 ? "🥉" :
                      score.rank}
                </td>

                <td style="display:flex;align-items:center;gap:10px;">
                    <img
                        src="${score.avatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=guest'}"
                        width="40"
                        height="40"
                        style="border-radius:50%;border:2px solid #60a5fa;"
                    >
                    ${score.username}
                </td>

                <td>${score.wpm}</td>
                <td>${score.accuracy}%</td>
            </tr>
        `;

        tbody.innerHTML += row;
    });

})
.catch(err => console.error(err));

</script>

</body>
</html>
