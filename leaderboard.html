<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard - Type Mastery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
       body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

        h1 {
            margin-top: 20px;
            font-size: 3rem;
            font-weight: 800;
            text-shadow:
                0 0 10px rgba(96,165,250,0.8),
                0 0 20px rgba(96,165,250,0.5);
        }

        /* CENTER WRAPPER */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        th {
            background: #1e293b;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(96,165,250,0.15);
        }

        .current-user td {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }

        /* ================= BURST LOADING SCREEN ================= */
        .loading-screen {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-text {
            font-size: 20px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .dot {
            width: 10px;
            height: 10px;
            margin-top: 15px;
            border-radius: 50%;
            background: #60a5fa;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        .empty {
            margin-top: 30px;
            opacity: 0.7;
        }
        .back-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
#leaderboard {
    flex: 1;
}
.footer {
    padding: 30px 0;
}
    </style>
</head>

<body>

<h1>🏆 Typing Leaderboard</h1>

<div id="leaderboard">
    <div class="loading-screen">
        <div class="loading-text">Loading...</div>
        <div class="dot"></div>
    </div>
</div>
<div class="footer">
<button class="back-btn" onclick="goToPage('mode.html')">
    ⬅ Back to Home
</button></div>
<script src="sounds.js"></script>
<script>
const currentUser = localStorage.getItem("username");
const container = document.getElementById("leaderboard");

/* ---------- SHOW LOADING ---------- */
container.innerHTML = `
    <div class="loading-screen">
        <div class="loading-text">Loading Leaderboard</div>
        <div class="dot"></div>
    </div>
`;

/* ---------- FETCH DATA ---------- */
fetch("https://typing-speed-enhancer-1.onrender.com/leaderboard")
.then(res => res.json())
.then(scores => {

    if (!scores || scores.length === 0) {
        container.innerHTML = `<p class="empty">No scores yet. Be the first 🔥</p>`;
        return;
    }

    // sort
    // ----------------------------
// Sort by WPM, then Accuracy
// ----------------------------
scores.sort((a, b) => {

    // Higher WPM first
    if (b.wpm !== a.wpm) {
        return b.wpm - a.wpm;
    }

    // If WPM is same, higher Accuracy first
    return b.accuracy - a.accuracy;
});

// ----------------------------
// Rank System
// Players share rank ONLY if
// BOTH WPM and Accuracy match
// ----------------------------
let rank = 1;

for (let i = 0; i < scores.length; i++) {

    if (
        i > 0 &&
        (
            scores[i].wpm !== scores[i - 1].wpm ||
            scores[i].accuracy !== scores[i - 1].accuracy
        )
    ) {
        rank = i + 1;
    }

    scores[i].rank = rank;
}

    let html = `
        <div class="container">
        <table>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>WPM</th>
                <th>Accuracy</th>
            </tr>
    `;

    scores.forEach(score => {

        const isCurrentUser =
            currentUser && score.username === currentUser;

        const rowClass = isCurrentUser ? "current-user" : "";

        const displayRank =
            score.rank === 1 ? "🥇" :
            score.rank === 2 ? "🥈" :
            score.rank === 3 ? "🥉" :
            "#" + score.rank;

        const avatar =
            score.avatar ||
            `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(score.username)}`;

        html += `
            <tr class="${rowClass}">
                <td>${displayRank}</td>

                <td style="display:flex;align-items:center;gap:10px;justify-content:center;">
                    <img src="${avatar}"
                        width="40"
                        height="40"
                        style="border-radius:50%;border:2px solid #60a5fa;">
                    ${score.username || "Unknown"}
                </td>

                <td>${score.wpm}</td>
                <td>${score.accuracy}%</td>
            </tr>
        `;
    });

    html += "</table></div>";

    container.innerHTML = html;
})
.catch(err => {
    console.error(err);
    container.innerHTML = `
        <p class="empty">Failed to load leaderboard ❌</p>
    `;
});
function goHome() {
    window.location.href = "mode.html";
}
</script>

</body>
</html>
