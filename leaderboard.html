<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard - Type Mastery</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #1e293b;
            padding: 12px;
            color: white;
        }

        td {
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(96,165,250,0.15);
        }

        .current-user td {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }

        .empty {
            margin-top: 30px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<h1>🏆 Leaderboard</h1>

<div class="container">
    <table id="leaderboardTable">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>WPM</th>
                <th>Accuracy</th>
            </tr>
        </thead>

        <tbody id="leaderboardBody"></tbody>
    </table>
</div>

<script>
const currentUser = localStorage.getItem("username");

/* ---------- LOAD LEADERBOARD ---------- */
fetch("https://typing-speed-enhancer-1.onrender.com/leaderboard")
.then(res => res.json())
.then(scores => {

    const tbody = document.getElementById("leaderboardBody");

    /* ---------- EMPTY STATE ---------- */
    if (!scores || scores.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="empty">No scores yet. Be the first 🔥</td>
            </tr>
        `;
        return;
    }

    /* ---------- SORT SAFETY ---------- */
    scores.sort((a, b) => b.wpm - a.wpm);

    /* ---------- RANKING ---------- */
    let rank = 1;

    for (let i = 0; i < scores.length; i++) {
        if (i > 0 && scores[i].wpm < scores[i - 1].wpm) {
            rank = i + 1;
        }
        scores[i].rank = rank;
    }

    /* ---------- BUILD TABLE ---------- */
    let html = "";

    scores.forEach(score => {

        const isCurrentUser =
            currentUser && score.username === currentUser;

        const rowClass = isCurrentUser ? "current-user" : "";

        const displayRank =
            score.rank === 1 ? "🥇" :
            score.rank === 2 ? "🥈" :
            score.rank === 3 ? "🥉" :
            score.rank;

        html += `
            <tr class="${rowClass}">
                <td>${displayRank}</td>

                <td style="display:flex;align-items:center;gap:10px;justify-content:center;">
                    <img
                        src="${score.avatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=guest'}"
                        width="40"
                        height="40"
                        style="border-radius:50%;border:2px solid #60a5fa;"
                    >
                    ${score.username || "Unknown"}
                </td>

                <td>${score.wpm}</td>
                <td>${score.accuracy}%</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;

})
.catch(err => {
    console.error(err);
    document.getElementById("leaderboardBody").innerHTML = `
        <tr>
            <td colspan="4" class="empty">Failed to load leaderboard ❌</td>
        </tr>
    `;
});
</script>

</body>
</html>
