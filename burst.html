<!DOCTYPE html>
<html>
<head>
    <title>Burst Mode</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        .app-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* ---------- STATS GRID (FIXED LAYOUT) ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255,255,255,0.06);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        /* ---------- WORD BOX ---------- */
        #wordBox {
            margin-top: 30px;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            color: #60a5fa;
        }

        input {
            display: block;
            margin: 20px auto;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            text-align: center;
        }

        button {
            padding: 10px 16px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #6366f1;
        }

        /* ---------- COMBO STATUS ---------- */
        #comboStatus {
            color: #38bdf8;
            font-weight: bold;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            #wordBox {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <h1>BURST MODE ⚡</h1>

    <div class="stats">

        <div class="card">
            <h3>Timer</h3>
            <p id="timer">60</p>
        </div>

        <div class="card">
            <h3>Score</h3>
            <p id="score">0</p>
        </div>

        <div class="card">
            <h3>Combo</h3>
            <p id="combo">0</p>
        </div>

        <div class="card">
            <h3>Status</h3>
            <p id="comboStatus">Start Typing...</p>
        </div>

    </div>

    <div id="wordBox">Press Start</div>

    <input type="text" id="wordInput" placeholder="Type here...">

    <div style="text-align:center;">
        <button onclick="startBurst()">Start</button>
        <button onclick="finishBurst()">End</button>
    </div>

</div>

<script src="word.js"></script>
<script src="burst.js"></script>

</body>
</html>
