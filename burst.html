<!DOCTYPE html>
<html>
<head>
    <title>Burst Mode</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        #combo {
            color: #f59e0b;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #f59e0b;
        }

        #wordBox {
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa;
        }

        input {
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            text-align: center;
        }

        button {
            margin: 10px;
        }

        @media (max-width: 600px) {
            .stats {
                flex-direction: column;
                align-items: center;
            }

            #wordBox {
                font-size: 24px;
            }

            input {
                width: 80%;
            }
        }

        /* NEW */
        #comboStatus {
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #38bdf8;
        }
    </style>
</head>

<body>

<h1>BURST MODE ⚡</h1>

<!-- ALL CARDS STAY TOGETHER -->
<div class="stats">

    <div class="card">
        <h3>Timer</h3>
        <p id="timer">60</p>
    </div>

    <div class="card">
        <h3>Score</h3>
        <p id="score">0</p>
    </div>

    <div class="card">
        <h3>Combo</h3>
        <p id="combo">0</p>
    </div>

    <!-- FIXED POSITION -->
    <div class="card">
        <h3>Combo Status</h3>
        <p id="comboStatus">Start Typing...</p>
    </div>

</div>

<div id="wordBox">
    Press Start
</div>

<input
    type="text"
    id="wordInput"
    placeholder="Type here..."
>

<br><br>

<button onclick="startBurst()">Start</button>
<button onclick="finishBurst()">End</button>

<script src="burst.js"></script>

</body>
</html>
