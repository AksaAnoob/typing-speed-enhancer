<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Type Mastery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url("img.png") center center/cover no-repeat;

    color:white;
    position:relative;
    overflow:hidden;
}

/* Dark overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

/* Content */
.container{
    position:relative;
    z-index:10;
    text-align:center;
    max-width:700px;
    padding:20px;
}

/* Badge */
.badge{
    display:inline-block;
    padding:10px 20px;
    border-radius:30px;

    background:rgba(56,189,248,.15);
    border:1px solid rgba(56,189,248,.4);

    color:#7dd3fc;
    margin-bottom:25px;

    backdrop-filter:blur(5px);
}

/* Glowing Logo */
.logo{
    font-size:clamp(2.6rem,7vw,5rem);

    font-weight:800;

    letter-spacing:6px;

    text-transform:uppercase;

    color:white;

    text-shadow:
        0 0 8px rgba(56,189,248,.4),
        0 0 15px rgba(56,189,248,.2);

    margin-bottom:10px;
}

@keyframes neonGlow{

    from{
        text-shadow:
            0 0 10px #38bdf8,
            0 0 20px #38bdf8,
            0 0 40px #38bdf8;
    }

    to{
        text-shadow:
            0 0 20px #38bdf8,
            0 0 40px #38bdf8,
            0 0 80px #38bdf8,
            0 0 120px #38bdf8;
    }
}

/* Typing text */
.typing-text{
    height:45px;

    color:#38bdf8;

    font-size:1.4rem;

    font-weight:600;

    margin-bottom:20px;
}

/* Description */
p{
    line-height:1.8;
    font-size:1.1rem;
    margin-bottom:30px;

    text-shadow:
    0 0 10px rgba(0,0,0,.7);
}

/* Features */
.features{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;

    margin-bottom:35px;
}

.feature{
    padding:10px 18px;

    border-radius:20px;

    background:
    rgba(255,255,255,.12);

    border:
    1px solid rgba(255,255,255,.15);
}

/* Button */
button{
    padding:16px 42px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #38bdf8
    );

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 10px 30px rgba(56,189,248,.4);
}
button:hover{

    transform:
    translateY(-3px)
    scale(1.05);

    box-shadow:
    0 15px 35px rgba(56,189,248,.5);
}

/* Floating words */
.word{
    position:absolute;
    color:rgba(255,255,255,.08);
    font-size:2rem;
    font-weight:700;

    pointer-events:none;

    animation:float 6s ease-in-out infinite;
}


@keyframes neonGlow{

    from{
        text-shadow:
            0 0 5px rgba(56,189,248,.6),
            0 0 10px rgba(56,189,248,.4);
    }

    to{
        text-shadow:
            0 0 8px rgba(56,189,248,.8),
            0 0 15px rgba(56,189,248,.5);
    }
}
@media(max-width:768px){

    .logo{
    font-size:clamp(3rem,8vw,6rem);
    font-weight:800;
    letter-spacing:8px;
    text-transform:uppercase;
    color:white;

    text-shadow:
        0 0 8px rgba(56,189,248,.5),
        0 0 15px rgba(56,189,248,.3);

    margin-bottom:15px;
}
    .typing-text{
        font-size:1.1rem;
    }

    .word{
        display:none;
    }

    button{
        width:220px;
    }
}

</style>
</head>

<body>



<div class="container">

    <div class="badge">
        ⌨️ The Ultimate Typing Platform
    </div>

    <h1 class="logo">TYPE MASTERY</h1>

    <div class="typing-text">
        <span id="changingText"></span>
    </div>

    <p>
        Boost your typing speed, improve accuracy,
        compete on leaderboards and track your progress.
    </p>

    <div class="features">
        <div class="feature">⚡ Fast Progress</div>
        <div class="feature">🎯 Accuracy Tracking</div>
        <div class="feature">🏆 Leaderboards</div>
    </div>

    <button onclick="goNext()">
        Start Practice →
    </button>

</div>

<script>

function goNext(){
    window.location.href = "home.html";
}

const phrases = [
    "Master Your Typing.",
    "Master Your Speed.",
    "Master Your Accuracy.",
    "Train Like A Pro."
];

let phraseIndex = 0;
let charIndex = 0;
let deleting = false;

const text = document.getElementById("changingText");

function animateText(){

    const current = phrases[phraseIndex];

    if(!deleting){

        text.textContent =
        current.substring(0, charIndex++);

        if(charIndex > current.length){

            deleting = true;

            setTimeout(
                animateText,
                1200
            );

            return;
        }

    }else{

        text.textContent =
        current.substring(0, charIndex--);

        if(charIndex < 0){

            deleting = false;

            phraseIndex =
            (phraseIndex + 1) % phrases.length;
        }
    }

    setTimeout(
        animateText,
        deleting ? 40 : 80
    );
}

animateText();

</script>

</body>
</html>
