<!DOCTYPE html>
<html>
<head>
  <title>Typing Speed Enhancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Typing Speed Enhancer</h1>

<div id="timer">60</div>

<p id="textToType">Click Start to begin</p>

<textarea id="inputBox" placeholder="Start typing here..."></textarea>

<br>

<button onclick="startTest()">Start</button>
<button onclick="finishTest()">Done</button>

<!-- RESULT BOX -->
<div id="result" style="display:none;">
  <h2>Results</h2>

  <p id="wpmResult"></p>
  <p id="accuracyResult"></p>

  <pre id="mistakeResult"></pre>

  <button onclick="restartTest()">Try Again</button>
</div>

<script src="script.js"></script>

</body>
</html>
