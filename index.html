
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Type Mastery</title>

<link rel="preload" as="image" href="img.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    url("img.png")
    center center/cover no-repeat;

    color:white;

    position:relative;
}

/* Dark overlay */

body::before{
    content:"";

    position:absolute;
    inset:0;

    background:
    rgba(0,0,0,0.45);

    z-index:1;
}

/* Container */

.container{

    position:relative;

    z-index:10;

    width:90%;
    max-width:1000px;

    text-align:center;

    animation:
    fadeIn 1.2s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:
        translateY(25px);
    }

    to{
        opacity:1;
        transform:
        translateY(0);
    }
}

/* Title */

h1{

    font-size:
    clamp(3rem,8vw,6rem);

    letter-spacing:8px;

    font-weight:700;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(56,189,248,.7),
        0 0 25px rgba(56,189,248,.4);

    margin-bottom:20px;
}

/* Animated text */

.typing-text{

    height:60px;

    font-size:
    clamp(1.3rem,4vw,2rem);

    color:#38bdf8;

    font-weight:600;

    margin-bottom:25px;
}

/* Description */

p{

    max-width:700px;

    margin:auto;

    font-size:1.15rem;

    line-height:1.8;

    opacity:.95;
}

/* Button */

button{

    margin-top:40px;

    padding:16px 42px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #38bdf8
    );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    transform:
    translateY(-3px);

    box-shadow:
    0 0 25px
    rgba(56,189,248,.5);
}

/* Floating words */

.word{

    position:absolute;

    color:
    rgba(255,255,255,.08);

    font-weight:bold;

    user-select:none;

    pointer-events:none;

    animation:
    floatWord 10s ease-in-out infinite;

    z-index:2;
}

@keyframes floatWord{

    0%,100%{
        transform:
        translateY(0);
    }

    50%{
        transform:
        translateY(-20px);
    }
}

/* Word positions */

.word1{
    top:10%;
    left:10%;
    font-size:2.5rem;
}

.word2{
    top:20%;
    right:10%;
    font-size:3rem;
}

.word3{
    bottom:20%;
    left:12%;
    font-size:2.8rem;
}

.word4{
    bottom:15%;
    right:15%;
    font-size:2.2rem;
}

.word5{
    top:55%;
    left:25%;
    font-size:2rem;
}

.word6{
    top:40%;
    right:30%;
    font-size:2.5rem;
}

.word7{
    bottom:40%;
    left:60%;
    font-size:2rem;
}

/* Mobile */

@media(max-width:768px){

    h1{
        letter-spacing:4px;
    }

    p{
        font-size:1rem;
        padding:0 10px;
    }

    button{
        width:220px;
    }

    .word{
        font-size:1.3rem !important;
    }
}

</style>
</head>

<body>

<div class="word word1">speed</div>
<div class="word word2">accuracy</div>
<div class="word word3">typing</div>
<div class="word word4">focus</div>
<div class="word word5">mastery</div>
<div class="word word6">practice</div>
<div class="word word7">wpm</div>

<div class="container">

    <h1>TYPE MASTERY</h1>

    <div class="typing-text">
        <span id="changingText"></span>
    </div>

    <p>
        Improve your typing speed and accuracy through
        focused practice, real-time challenges and
        performance tracking.
    </p>

    <button onclick="goNext()">
        Start Practice
    </button>

</div>

<script>

function goNext(){
    window.location.href = "home.html";
}

/* Typing animation */

const phrases = [

    "Master Your Typing.",

    "Master Your Speed.",

    "Master Your Accuracy.",

    "Train Like A Pro."
];

let phraseIndex = 0;
let charIndex = 0;
let deleting = false;

const text =
document.getElementById(
"changingText"
);

function animateText(){

    let current =
        phrases[phraseIndex];

    if(!deleting){

        text.textContent =
        current.substring(
        0,
        charIndex++
        );

        if(charIndex >
           current.length){

            deleting = true;

            setTimeout(
            animateText,
            1200
            );

            return;
        }

    }else{

        text.textContent =
        current.substring(
        0,
        charIndex--
        );

        if(charIndex < 0){

            deleting = false;

            phraseIndex =
            (phraseIndex+1)
            % phrases.length;
        }
    }

    setTimeout(
    animateText,
    deleting ? 40 : 80
    );
}

animateText();

/* Background Parallax */

document.addEventListener(
"mousemove",
(e)=>{

    let x =
    (e.clientX /
     window.innerWidth
     - 0.5) * 20;

    let y =
    (e.clientY /
     window.innerHeight
     - 0.5) * 20;

    document.body.style.backgroundPosition =
        `${50+x/10}% ${50+y/10}%`;
});

</script>

</body>
</html>
