<!DOCTYPE html>
<html>
<head>
  <title>Typing Speed Enhancer</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app-container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1, h3 {
      text-align: center;
    }

    .stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      text-align: center;
    }

    .difficulty-container {
      text-align: center;
      margin: 10px 0;
    }

    select {
      padding: 6px;
      border-radius: 8px;
    }

    .typing-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      min-height: 120px;
      cursor: text;
      font-size: 20px;
      line-height: 1.8;
    }

    .typing-box span.correct {
      color: #22c55e;
    }

    .typing-box span.incorrect {
      color: #ef4444;
    }

    #hiddenInput {
      opacity: 0;
      position: absolute;
    }

    button {
      padding: 8px 14px;
      margin: 10px 5px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #6366f1;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
    }
  </style>
</head>

<body>

<div class="app-container">

  <h1>TYPE MASTERY ⚡</h1>
  <h3 id="welcomeUser"></h3>

  <!-- STATS -->
  <div class="stats">
    <div class="card">
      <h3>Timer</h3>
      <p id="timer">60</p>
    </div>

    <div class="card">
      <h3>WPM</h3>
      <p id="liveWpm">0</p>
    </div>

    <div class="card">
      <h3>Accuracy</h3>
      <p id="liveAccuracy">100%</p>
    </div>
  </div>

  <!-- DIFFICULTY -->
  <div class="difficulty-container">
    <label>Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <!-- TEXT -->
  <div class="typing-box" onclick="focusInput()">
    <div id="textDisplay">Click Start to begin</div>
  </div>

  <input id="hiddenInput" oninput="handleTyping()" />

  <!-- BUTTONS -->
  <div style="text-align:center;">
    <button onclick="startTest()">Start</button>
    <button onclick="finishTest()">Done</button>
  </div>

  <!-- RESULT -->
  <div id="result">
    <h2>Results</h2>
    <p id="wpmResult"></p>
    <p id="accuracyResult"></p>
    <pre id="mistakeResult"></pre>
    <button onclick="restartTest()">Try Again</button>
  </div>

</div>

<script src="sentence.js"></script>
<script src="script.js"></script>

</body>
</html>
