<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Type Mastery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    position:relative;

    /* ✅ SAME AS MODE PAGE */
    background: #0f172a;
}

/* Subtle glow like mode page */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(14,165,233,0.12), transparent 45%);
    pointer-events:none;
}

/* Grid */

body::after{

    content:"";

    position:absolute;
    inset:0;

    background-image:
    linear-gradient(
        rgba(255,255,255,.03) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(255,255,255,.03) 1px,
        transparent 1px
    );

    background-size:50px 50px;
}

/* Floating Words */

.word{

    position:absolute;

    color: rgba(255,255,255,.05);

    font-weight:bold;

    user-select:none;

    pointer-events:none;

    animation: floatWord linear infinite;

    will-change: transform;
}

@keyframes floatWord{
    from{
        transform: translateY(110vh);
    }
    to{
        transform: translateY(-20vh);
    }
}

/* Card */

.card{

    width:420px;

    max-width:90%;

    padding:45px;

    border-radius:30px;

    text-align:center;

    color:white;

    z-index:10;

    background: rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border: 1px solid rgba(255,255,255,.1);

    box-shadow: 0 20px 50px rgba(0,0,0,.4);

    animation: fadeUp .8s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform: translateY(25px);
    }
    to{
        opacity:1;
        transform: translateY(0);
    }
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

h1{
    color:white;
    margin-bottom:10px;
    letter-spacing:3px;
    text-shadow:
        0 0 15px rgba(56,189,248,.6),
        0 0 25px rgba(56,189,248,.4);
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

/* Inputs */

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color:white;
    outline:none;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 15px rgba(56,189,248,.3);
}

/* Button */

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    color:white;
    font-weight:600;
    background: linear-gradient(135deg,#2563eb,#38bdf8);
    transition:.3s;
}

button:hover{
    transform: translateY(-2px);
    box-shadow:0 0 25px rgba(56,189,248,.5);
}

button:disabled{
    opacity:.7;
}

/* Link */

a{
    color:#60a5fa;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

#message{
    margin-top:15px;
    color:#f87171;
}

</style>
</head>

<body>

<!-- Floating words container -->

<div class="card">

    <div class="logo">⌨</div>

    <h1>TYPE MASTERY</h1>

    <p>Access Your Typing Arena</p>

    <form id="loginForm">

        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" id="loginBtn">LOGIN</button>

    </form>

    <br>

    <a href="register.html">Don't have an account? Register</a>

    <p id="message"></p>

</div>

<script>

/* Floating Background Words */
window.onload = () => {

    const words = [
        "A","S","D","F",
        "J","K","L",
        "WPM",
        "SPEED",
        "FOCUS",
        "ACCURACY",
        "TYPING"
    ];

    for (let i = 0; i < 30; i++) {

        let el = document.createElement("div");
        el.className = "word";

        el.innerText =
            words[Math.floor(Math.random() * words.length)];

        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (1.5 + Math.random() * 3) + "rem";
        el.style.animationDuration = (10 + Math.random() * 15) + "s";

        document.body.appendChild(el);
    }
};

/* Login Logic */

document.getElementById("loginForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("message");

    btn.innerText = "Logging in...";
    btn.disabled = true;

    try {

        const response = await fetch(
            "https://typing-speed-enhancer-1.onrender.com/login",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            }
        );

        const data = await response.json();

        if (response.ok) {

            localStorage.setItem("token", data.token);
            localStorage.setItem("username", data.username);

            btn.innerText = "Success ✔";

            setTimeout(() => {
                window.location.href = "mode.html";
            }, 300);

        } else {
            msg.innerText = data.message;
            btn.innerText = "LOGIN";
            btn.disabled = false;
        }

    } catch (error) {
        msg.innerText = "Error connecting to server";
        btn.innerText = "LOGIN";
        btn.disabled = false;
    }
});

</script>

</body>
</html>
