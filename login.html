<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Type Mastery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#050816,#0f172a,#1e3a8a);
    }

    .card{
        width:400px;
        padding:40px;
        border-radius:20px;
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(15px);
        border:1px solid rgba(96,165,250,0.3);
        box-shadow:0 0 25px rgba(59,130,246,0.3);
        text-align:center;
        color:white;
    }

    h1{
        color:#60a5fa;
        margin-bottom:10px;
        text-shadow:0 0 15px #3b82f6;
    }

    p{
        color:#cbd5e1;
        margin-bottom:25px;
    }

    input{
        width:100%;
        padding:14px;
        margin:10px 0;
        border:none;
        border-radius:12px;
        outline:none;
        background:rgba(255,255,255,0.08);
        color:white;
    }

    input::placeholder{
        color:#cbd5e1;
    }

    button{
        width:100%;
        padding:14px;
        margin-top:15px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        color:white;
        font-weight:bold;
        background:linear-gradient(90deg,#2563eb,#7c3aed);
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.03);
        box-shadow:0 0 20px rgba(124,58,237,0.8);
    }

    a{
        color:#60a5fa;
        text-decoration:none;
    }

    #message{
        margin-top:15px;
        color:#f87171;
    }
</style>


</head>

<body>

<div class="card">


<h1>TYPE MASTERY ⚡</h1>

<p>Access Your Typing Arena</p>

<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        LOGIN
    </button>

</form>

<br>

<a href="register.html">
    Don't have an account? Register
</a>

<p id="message"></p>


</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("https://typing-speed-enhancer-1.onrender.com/login", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if(response.ok){

            localStorage.setItem("token",data.token);
            localStorage.setItem("username",data.username);

            window.location.href = "mode.html";

        }else{

            document.getElementById("message").innerText =
            data.message;

        }

    }catch(error){

        document.getElementById("message").innerText =
        "Error connecting to server";

    }

});
</script>

</body>
</html>
