<!DOCTYPE html>
<html>
<head>
    <title>Event Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
          body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

        h1 {
            margin-top: 25px;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;

            color: white;

            text-shadow:
                0 0 10px rgba(96,165,250,0.9),
                0 0 22px rgba(96,165,250,0.6),
                0 0 35px rgba(96,165,250,0.4);
        }

        #leaderboard {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10px;
            min-height: 70vh;
        }

        /* ================= LOADING ================= */
        .loading-screen {
            height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading-text {
            font-size: 18px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .dot {
            width: 10px;
            height: 10px;
            margin-top: 15px;
            border-radius: 50%;
            background: #60a5fa;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        /* ================= TABLE ================= */
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 750px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        th {
            background: #1e293b;
            color: white;
            padding: 14px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        td {
            padding: 14px;
            text-align: center;
            background: rgba(255,255,255,0.05);
        }

        tr {
            transition: 0.2s;
        }

        tr:hover td {
            background: rgba(96,165,250,0.15);
        }

        /* current user highlight */
        .current-user td {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }

        /* user cell */
        .user-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* avatar glow upgrade */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(96,165,250,0.6);
            box-shadow: 0 0 10px rgba(96,165,250,0.3);
        }

        .empty {
            margin-top: 30px;
            opacity: 0.7;
        }
        .back-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
#leaderboard {
    flex: 1;
}
.footer {
    padding: 30px 0;
}
    </style>
</head>

<body>

<h1>⚡ Event Leaderboard</h1>

<div id="leaderboard">
    <div class="loading-screen">
        <div class="loading-text">Loading Leaderboard</div>
        <div class="dot"></div>
    </div>
</div>
<div class="footer">
    <button onclick="goHome()" class="back-btn">⬅ Back to Home</button>
</div>
<script>
const currentUser = localStorage.getItem("username");
const container = document.getElementById("leaderboard");

/* loading */
container.innerHTML = `
    <div class="loading-screen">
        <div class="loading-text">Loading Leaderboard</div>
        <div class="dot"></div>
    </div>
`;

fetch("https://typing-speed-enhancer-1.onrender.com/event-leaderboard")
.then(res => res.json())
.then(data => {
    const bestMap = {};

// keep only best score per user (and keep its mode too)
data.forEach(player => {

    const existing = bestMap[player.username];

    if (!existing || player.score > existing.score) {
        bestMap[player.username] = player;
    }
});

// convert back to array
data = Object.values(bestMap);
    if (!data || data.length === 0) {
        container.innerHTML = `<p class="empty">No scores yet. Be the first 🔥</p>`;
        return;
    }

    data.sort((a, b) => b.score - a.score);

    let rank = 1;
    for (let i = 0; i < data.length; i++) {
        if (i > 0 && data[i].score < data[i - 1].score) {
            rank = i + 1;
        }
        data[i].rank = rank;
    }

    let html = `
        <table>
            <tr>
                <th>Rank</th>
                <th>User</th>
                <th>Score</th>
                <th>Mode</th>
            </tr>
    `;

    data.forEach(player => {

        const isCurrentUser =
            currentUser && player.username === currentUser;

        const rowClass = isCurrentUser ? "current-user" : "";

        let displayRank =
            player.rank === 1 ? "🥇" :
            player.rank === 2 ? "🥈" :
            player.rank === 3 ? "🥉" :
            "#" + player.rank;

        const avatar =
            player.avatar ||
            `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(player.username)}`;

        html += `
            <tr class="${rowClass}">
                <td>${displayRank}</td>

                <td>
                    <div class="user-cell">
                        <img class="avatar" src="${avatar}">
                        <span>${player.username || "Unknown"}</span>
                    </div>
                </td>

                <td>${player.score}</td>
                <td>${player.mode || "event"}</td>
            </tr>
        `;
    });

    html += "</table>";

    container.innerHTML = html;
})
.catch(err => {
    console.error(err);
    container.innerHTML =
        `<p class="empty">Failed to load leaderboard ❌</p>`;
});
function goHome() {
    window.location.href = "mode.html";
}
</script>

</body>
</html>
