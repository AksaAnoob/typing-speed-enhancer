<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 550px;
            padding: 25px;
            border-radius: 16px;

            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin: 10px 0;

            border: none;
            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,0.08);
            color: white;
        }

        textarea {
            resize: none;
        }

        .send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;

            background: #4f46e5;
            color: white;

            cursor: pointer;
            font-weight: bold;

            transition: 0.2s;
        }

        .send-btn:hover {
            background: #6366f1;
            transform: scale(1.03);
        }

        #statusMessage {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            font-weight: bold;
        }

        .back-btn {
            margin-top: 25px;

            padding: 10px 18px;
            border: none;
            border-radius: 10px;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #06b6d4
            );

            color: white;
            font-weight: bold;

            transition: 0.2s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>📩 Contact Us</h1>

    <input
        id="name"
        type="text"
        placeholder="Your Name"
    >

    <input
        id="email"
        type="email"
        placeholder="Your Email"
    >

    <textarea
        id="message"
        rows="6"
        placeholder="Type your message here..."
    ></textarea>

    <button
        class="send-btn"
        onclick="sendMessage()"
    >
        Send Message
    </button>

    <div id="statusMessage"></div>

</div>

<button
    onclick="goBack()"
    class="back-btn"
>
    ⬅ Back to Home
</button>

<script>

async function sendMessage() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message").value.trim();

    const status =
        document.getElementById("statusMessage");

    if (!name || !email || !message) {

        status.style.display = "block";
        status.style.color = "#ef4444";
        status.innerText =
            "Please fill all fields.";

        return;
    }

    try {

        const response = await fetch(
            "https://typing-speed-enhancer-1.onrender.com/contact",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    message
                })
            }
        );

        if (!response.ok) {
            throw new Error();
        }

        status.style.display = "block";
        status.style.color = "#22c55e";
        status.innerText =
            "Message sent successfully ✅";

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("message").value = "";

    } catch (err) {

        status.style.display = "block";
        status.style.color = "#ef4444";
        status.innerText =
            "Failed to send message ❌";
    }
}

function goBack() {
    window.location.href = "mode.html";
}

</script>

</body>
</html>
