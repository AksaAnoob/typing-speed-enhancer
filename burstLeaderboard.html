<!DOCTYPE html>
<html>
<head>
    <title>Burst Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* small safety styling so table always looks clean */
        #leaderboard {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 700px;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e293b;
            color: #fff;
        }

        tr {
            background: rgba(255,255,255,0.05);
        }

        tr:hover {
            background: rgba(96,165,250,0.15);
        }

        .current-user {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🔥 Burst Leaderboard</h1>

<!-- container where JS injects table -->
<div id="leaderboard"></div>

<script src="words.js"></script>
<script src="burst.js"></script>
<script src="burstLeaderboard.js"></script>

</body>
</html>
