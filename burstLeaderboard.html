<!DOCTYPE html>
<html>
<head>
    <title>Burst Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
          body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
        h1 {
            margin-top: 25px;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color:white;

            text-shadow:
                0 0 10px rgba(96,165,250,0.9),
                0 0 22px rgba(96,165,250,0.6),
                0 0 35px rgba(96,165,250,0.4);
        }

        /* ================= CENTER AREA ================= */
        #leaderboard {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* 👈 IMPORTANT FIX */
    padding-top: 10px;       /* 👈 pushes content upward */
    min-height: 70vh;
}

        /* ================= LOADING (BURST STYLE) ================= */
        .loading-screen {
    height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

        .loading-text {
            font-size: 18px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .dot {
            width: 10px;
            height: 10px;
            margin-top: 15px;
            border-radius: 50%;
            background: #60a5fa;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        /* ================= TABLE ================= */
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 750px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e293b;
            color: white;
        }

        tr {
            background: rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        tr:hover {
            background: rgba(96,165,250,0.15);
        }

        .current-user {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }

        .empty {
            margin-top: 30px;
            opacity: 0.7;
        }
        .back-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
#leaderboard {
    flex: 1;
}
.footer {
    padding: 20px 0;
}
    </style>
</head>

<body>

<h1>🔥 Burst Leaderboard</h1>

<!-- SINGLE CLEAN CONTAINER -->
<div id="leaderboard">
    <div class="loading-screen">
        <div class="loading-text">Loading Leaderboard</div>
        <div class="dot"></div>
    </div>
</div>
<div class="footer">
<button class="back-btn" onclick="goToPage('mode.html')">
    ⬅ Back to Home
</button></div>
<script src="sounds.js"></script>
<script src="burstLeaderboard.js"></script>
<script>
function goHome() {
    window.location.href = "mode.html";
}
</script>
</body>
</html>
