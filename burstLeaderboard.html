<!DOCTYPE html>
<html>
<head>
    <title>Burst Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        #leaderboard {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 750px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e293b;
            color: white;
        }

        tr {
            background: rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        tr:hover {
            background: rgba(96,165,250,0.15);
        }

        .current-user {
            background: rgba(96,165,250,0.25);
            font-weight: bold;
        }

        .empty {
            margin-top: 30px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<h1>🔥 Burst Leaderboard</h1>

<div id="leaderboard"></div>

<script src="burstLeaderboard.js"></script>

</body>
</html>
