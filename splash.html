<!DOCTYPE html>
<html>
<head>
<title>Type Mastery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;

    /* YOUR IMAGE BACKGROUND */
    background: url("img.png") no-repeat center center/cover;

    position:relative;
}

/* dark overlay so text is visible */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.55);
    z-index:1;
}

/* floating particles */
.particle{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    opacity:0.3;
    animation: float 8s infinite linear;
    z-index:2;
}

@keyframes float{
    0%{transform:translateY(100vh) scale(0);}
    100%{transform:translateY(-10vh) scale(1);}
}

.container{
    text-align:center;
    z-index:3;
}

h1{
    font-size:4rem;
    letter-spacing:4px;
    text-transform:uppercase;

    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid white;
    width:0;
    animation: typing 3s steps(12) forwards, blink 0.8s infinite;
}

@keyframes typing{
    from{width:0;}
    to{width:100%;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

p{
    margin-top:15px;
    font-size:1.2rem;
    opacity:0.9;
}

button{
    margin-top:30px;
    padding:12px 25px;
    font-size:1rem;
    border:none;
    border-radius:30px;
    cursor:pointer;

    background:#07aaf0;
    color:#0f172a;
    font-weight:bold;

    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    background:white;
}

/* glow effect */
.glow{
    position:absolute;
    width:400px;
    height:400px;
    background:#38bdf8;
    filter:blur(150px);
    opacity:0.25;
    border-radius:50%;
    animation: moveGlow 6s infinite alternate;
    z-index:1;
}

@keyframes moveGlow{
    from{transform:translate(-200px,-200px);}
    to{transform:translate(200px,200px);}
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
    <h1>TYPE MASTERY</h1>
    <p>Improve Your Typing Speed & Accuracy</p>

    <button onclick="goNext()">Start Practice</button>
</div>

<script>
function goNext(){
    window.location.href = "home.html";
}

// floating particles
for(let i=0;i<25;i++){
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDuration = (3 + Math.random()*5) + "s";
    p.style.opacity = Math.random();
    document.body.appendChild(p);
}
</script>

</body>
</html>
