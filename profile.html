<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg">

<div class="profile-container">

    <h1 class="title">👤 My Profile</h1>

    <!-- PROFILE HEADER -->
    <div class="glass-card header">

        <div class="avatar-section">
            <img id="avatar" class="avatar"
                 src="https://api.dicebear.com/7.x/initials/svg?seed=User">

            <button onclick="openAvatarPicker()">Change Avatar</button>
        </div>

        <h2 id="username">Loading...</h2>

    </div>

    <!-- STATS -->
    <div class="stats">

        <div class="glass-card stat">
            <h3>Best WPM</h3>
            <p id="bestWpm">0</p>
        </div>

        <div class="glass-card stat">
            <h3>Accuracy</h3>
            <p id="bestAccuracy">0%</p>
        </div>

        <div class="glass-card stat">
            <h3>Burst Score</h3>
            <p id="bestBurst">0</p>
        </div>

    </div>

</div>

<!-- AVATAR MODAL -->
<div id="avatarModal" class="modal hidden">

    <div class="modal-content glass-card">

        <h2>Select Avatar</h2>

        <div class="avatar-grid">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=1" onclick="selectAvatar('identicon1')">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=2" onclick="selectAvatar('identicon2')">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=3" onclick="selectAvatar('identicon3')">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=4" onclick="selectAvatar('identicon4')">
        </div>

        <button onclick="saveAvatar()">Save</button>
        <button onclick="closeAvatarPicker()">Close</button>

    </div>

</div>

<script src="profile.js"></script>

</body>
</html>
