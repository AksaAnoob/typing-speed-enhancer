<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .hidden { display: none !important; }

        .avatar-grid img {
            cursor: pointer;
            width: 60px;
            height: 60px;
            margin: 5px;
            transition: 0.2s;
            border-radius: 10px;
        }

        .avatar-grid img:hover {
            transform: scale(1.1);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg">
<div class="profile-container">

    <h1 class="title">👤 My Profile</h1>

    <!-- PROFILE HEADER -->
    <div class="glass-card header">

        <div class="avatar-section">

            <img id="avatar" class="avatar"
                 src="https://api.dicebear.com/7.x/identicon/svg?seed=loading">

            <button onclick="openAvatarPicker()">Change Avatar</button>
        </div>

        <h2 id="username">Loading...</h2>

    </div>

    <!-- STATS -->
    <div class="stats">

        <div class="glass-card stat">
            <h3>Best WPM</h3>
            <p id="bestWpm">0</p>
        </div>

        <div class="glass-card stat">
            <h3>Accuracy</h3>
            <p id="bestAccuracy">0%</p>
        </div>

        <div class="glass-card stat">
            <h3>Burst Score</h3>
            <p id="bestBurst">0</p>
        </div>

    </div>

</div>

<!-- AVATAR MODAL -->
<div id="avatarModal" class="modal hidden">

    <div class="modal-content">

        <h2>Select Avatar</h2>

       <div class="avatar-grid">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat"
         onclick="selectAvatar('cat', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=dog"
         onclick="selectAvatar('dog', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=lion"
         onclick="selectAvatar('lion', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=tiger"
         onclick="selectAvatar('tiger', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=rabbit"
         onclick="selectAvatar('rabbit', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=apple"
         onclick="selectAvatar('apple', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=banana"
         onclick="selectAvatar('banana', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=flower"
         onclick="selectAvatar('flower', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=star"
         onclick="selectAvatar('star', event)">

    <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=rocket"
         onclick="selectAvatar('rocket', event)">

</div>

        <br>

        <button onclick="saveAvatar()">Save</button>
        <button onclick="closeAvatarPicker()">Close</button>

    </div>

</div>

<script src="profile.js"></script>

</body>
</html>
