<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .hidden {
            display: none !important;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* ---------------- PROFILE ---------------- */

        .profile-container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .glass-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            color: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatar-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* ---------------- STATS ---------------- */

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .stat {
            flex: 1;
            text-align: center;
        }

        /* ---------------- AVATAR GRID ---------------- */

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .avatar-grid img {
            cursor: pointer;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            transition: 0.25s ease;
        }

        .avatar-grid img:hover {
            transform: scale(1.15);
            filter: brightness(1.2);
        }

        .avatar-grid img.selected {
            border: 3px solid #4f46e5;
            transform: scale(1.1);
        }

        /* ---------------- MODAL ---------------- */

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.92);
            color: white;
            padding: 20px;
            border-radius: 16px;
            width: 350px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal button {
            margin-top: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .back-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

.back-btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

    </style>
</head>

<body>

<div class="profile-container">

    <h1 class="title">👤 My Profile</h1>

    <!-- PROFILE HEADER -->
    <div class="glass-card header">

        <div class="avatar-section">
            <img id="avatar" class="avatar"
                 src="https://api.dicebear.com/7.x/identicon/svg?seed=loading">

            <button onclick="openAvatarPicker()">Change Avatar</button>
        </div>

        <h2 id="username">Loading...</h2>

    </div>

    <!-- STATS -->
    <div class="stats">

        <div class="glass-card stat">
            <h3>Best WPM</h3>
            <p id="bestWpm">0</p>
        </div>

        <div class="glass-card stat">
            <h3>Accuracy</h3>
            <p id="bestAccuracy">0%</p>
        </div>

        <div class="glass-card stat">
            <h3>Burst Score</h3>
            <p id="bestBurst">0</p>
        </div>
        <div class="glass-card stat">
    <h3>Best Event Score</h3>
    <p id="eventBestDisplay">0</p>
</div>

    </div>
    <div style="text-align:center; margin-top: 30px;">
<button class="back-btn" onclick="goToPage('mode.html')">
    ⬅ Back to Home
</button></div>
</div>

<!-- AVATAR MODAL -->
<div id="avatarModal" class="modal hidden">

    <div class="modal-content">

        <h2>Select Avatar</h2>

        <div class="avatar-grid">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat"
                 onclick="selectAvatar(this,'cat')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=dog"
                 onclick="selectAvatar(this,'dog')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=lion"
                 onclick="selectAvatar(this,'lion')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=tiger"
                 onclick="selectAvatar(this,'tiger')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=rabbit"
                 onclick="selectAvatar(this,'rabbit')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=apple"
                 onclick="selectAvatar(this,'apple')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=banana"
                 onclick="selectAvatar(this,'banana')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=flower"
                 onclick="selectAvatar(this,'flower')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=star"
                 onclick="selectAvatar(this,'star')">

            <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=rocket"
                 onclick="selectAvatar(this,'rocket')">

        </div>

        <button onclick="saveAvatar()">Save</button>
        <button onclick="closeAvatarPicker()">Close</button>

    </div>

</div>
<script src="sounds.js"></script>
<script>
let selectedAvatar = null;

const backendURL = "https://typing-speed-enhancer-1.onrender.com";
const username = localStorage.getItem("username");

document.getElementById("username").innerText =
    username || "Guest";

/* ---------------- AVATAR ---------------- */

function getAvatarUrl(seed) {
    return `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${seed}`;
}

/* ---------------- PROFILE LOAD ---------------- */

if (username) {
    fetch(`${backendURL}/profile/${username}`)
    .then(res => res.json())
    .then(data => {

        document.getElementById("bestWpm").innerText = data.wpm ?? 0;
        document.getElementById("bestAccuracy").innerText = (data.accuracy ?? 0) + "%";
        document.getElementById("bestBurst").innerText = data.burstScore ?? 0;

        document.getElementById("avatar").src =
    data.avatar || getAvatarUrl(username);
    

    })
    .catch(err => console.log(err));
    fetch(`${backendURL}/event-leaderboard`)
    .then(res => res.json())
    .then(data => {

        const username = localStorage.getItem("username");

        // 1. keep best score per user (SAME as leaderboard)
        const bestMap = {};

        data.forEach(player => {
            const existing = bestMap[player.username];

            if (!existing || player.score > existing.score) {
                bestMap[player.username] = player;
            }
        });

        const cleaned = Object.values(bestMap);

        // 2. find current user
        const me = cleaned.find(p => p.username === username);
        const modeLabel =
    me?.mode === "fire" ? "🔥 Fire Mode" :
    me?.mode === "rain" ? "🌧 Rain Mode" :
    me?.mode || "-";

document.getElementById("eventBestDisplay").innerText =
    me ? `${me.score} (${modeLabel})` : "0";
        // 3. update UI
        
    });
}

/* ---------------- MODAL ---------------- */

function openAvatarPicker() {
    selectedAvatar = null;
    document.getElementById("avatarModal").classList.remove("hidden");
}

function closeAvatarPicker() {
    document.getElementById("avatarModal").classList.add("hidden");
}

/* ---------------- SELECT AVATAR ---------------- */

function selectAvatar(el, id) {

    selectedAvatar = id;

    document.getElementById("avatar").src = getAvatarUrl(id);

    document.querySelectorAll(".avatar-grid img")
        .forEach(img => img.classList.remove("selected"));

    el.classList.add("selected");
}

/* ---------------- SAVE ---------------- */

function saveAvatar() {

    if (!selectedAvatar) {
        showModal("Oops", "Please select an avatar first!");
        return;
    }

    const avatarUrl = getAvatarUrl(selectedAvatar);

    fetch(`${backendURL}/updateAvatar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: username,
            avatar: avatarUrl
        })
    })
    .then(res => res.json())
    .then(() => {
        showModal("Success", "Avatar updated!");
        closeAvatarPicker();
    })
    .catch(() => {
        showModal("Error", "Failed to update avatar");
    });
}

/* ---------------- CUSTOM MODAL ---------------- */

function showModal(title, message) {
    let modal = document.getElementById("customModal");
    if (!modal) {
        modal = document.createElement("div");
        modal.id = "customModal";
        modal.className = "modal";
        modal.innerHTML = `
            <div class="modal-content">
                <h2 id="modalTitle"></h2>
                <p id="modalMessage"></p>
                <button onclick="closeModal()">OK</button>
            </div>
        `;
        document.body.appendChild(modal);
    }

    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMessage").innerText = message;
    modal.classList.remove("hidden");
}

function closeModal() {
    document.getElementById("customModal").classList.add("hidden");
}
function goHome() {
    window.location.href = "mode.html";
}
</script>

</body>
</html>
