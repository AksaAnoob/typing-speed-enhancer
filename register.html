<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Type Mastery</title>
    

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#050816,#0f172a,#1e3a8a);
    }

    .card{
        width:420px;
        padding:40px;
        border-radius:20px;
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(15px);
        border:1px solid rgba(96,165,250,0.3);
        box-shadow:0 0 25px rgba(59,130,246,0.3);
        text-align:center;
        color:white;
    }

    h1{
        color:#60a5fa;
        margin-bottom:10px;
        text-shadow:0 0 15px #3b82f6;
    }

    p{
        color:#cbd5e1;
        margin-bottom:25px;
    }

    input{
        width:100%;
        padding:14px;
        margin:10px 0;
        border:none;
        border-radius:12px;
        outline:none;
        background:rgba(255,255,255,0.08);
        color:white;
    }

    input::placeholder{
        color:#cbd5e1;
    }

    button{
        width:100%;
        padding:14px;
        margin-top:15px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        color:white;
        font-weight:bold;
        background:linear-gradient(90deg,#2563eb,#7c3aed);
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.03);
        box-shadow:0 0 20px rgba(124,58,237,0.8);
    }

    a{
        color:#60a5fa;
        text-decoration:none;
    }

    #message{
        margin-top:15px;
        color:#4ade80;
    }
</style>


</head>

<body>

<div class="card">


<h1>TYPE MASTERY ⚡</h1>

<p>Create Your Account</p>

<form id="registerForm">

    <input
        type="text"
        id="username"
        placeholder="Username"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        REGISTER
    </button>

</form>

<br>

<a href="login.html">
    Already have an account? Login
</a>

<p id="message"></p>


</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const messageBox = document.getElementById("message");

    // RESET MESSAGE EVERY TIME
    messageBox.innerText = "";

    // ✅ FRONTEND VALIDATION FIRST (IMPORTANT)
    const pattern = /^(?=.*[A-Z]).{6,}$/;

    if (!pattern.test(password)) {
        messageBox.style.color = "red";
        messageBox.innerText =
        "Password must be 6+ characters and include 1 uppercase letter!";
        return; // ❌ STOP HERE, DO NOT CALL SERVER
    }

    try {

        const response = await fetch("https://typing-speed-enhancer-1.onrender.com/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                email,
                password
            })
        });

        const data = await response.json();

        if (response.ok) {

            messageBox.style.color = "#4ade80";
            messageBox.innerText =
            "Registration successful! Redirecting...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);

        } else {
            messageBox.style.color = "red";
            messageBox.innerText = data.message;
        }

    } catch (error) {
        messageBox.style.color = "red";
        messageBox.innerText =
        "Server not responding";
    }

});
</script>

</body>
</html>
